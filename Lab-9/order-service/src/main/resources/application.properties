spring.application.name=order-service
server.port=8081

# Load Lab-9/.env (working directory is usually the module folder)
dotenv.directory=..

# MySQL — one order per customer (customer_id is unique)
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Customer service base URL used by the RestClient bean
customer.service.url=${CUSTOMER_SERVICE_URL}
